name: CI

# 엔진(engine-rs)의 서식과 시험, 34장 받아들임 묶음의 실행기 시험을 푸시와 PR에서 자동으로 돈다. 화면·호스트 시험은 릴리스 워크플로(release.yml)가 맡는다.
on:
  push:
    branches: [main]
    paths:
      - 'engine-rs/**'
      - 'fixtures/**'
      - 'test.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'engine-rs/**'
      - 'fixtures/**'
      - 'test.sh'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    # 엔진은 macOS 도구(launchctl 흉내, /usr/bin/sqlite3)와 경로를 가정하므로 macOS에서 돈다.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --manifest-path engine-rs/Cargo.toml --all -- --check
      # test.sh 는 통합 시험과 예제를 지어서 ais-core 가 늘 test-support(시험 전용 기능)가 켜진 채 빌드된다.
      # 시험 없이 빌드하는 운영 모양이 깨져도 test.sh 는 모르므로 여기서 따로 본다(이슈 #84).
      - name: Check production build (no test-support)
        run: |
          cargo check --manifest-path engine-rs/Cargo.toml --workspace
          # 운영 의존 그래프에 test-support 가 끼어 있으면 위 검사가 의미를 잃으므로 막는다
          if cargo tree --manifest-path engine-rs/Cargo.toml --workspace -e normal,build -f '{p} [{f}]' | grep -q 'test-support'; then
            echo '운영 빌드에 test-support 가 켜져 있다' >&2
            exit 1
          fi
      # bash test.sh 안의 34장 받아들임 시험(ais-cli/tests/acceptance_bundle.rs)이 node 로 실행기를 부른다
      - name: Test engine
        run: bash test.sh
      - name: Test acceptance runner
        run: node fixtures/runner-test.mjs
