<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="440" viewBox="0 0 1160 440">
  <title>macOS 첫 실행 허용 절차 설명 그림</title>
  <desc>차단 대화상자를 완료로 닫고 시스템 설정의 개인정보 보호 및 보안에서 aisurada만 그래도 열기로 허용한 뒤 인증합니다. 실제 화면을 재구성한 설명 그림입니다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#203a32" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="none" stroke="#6d9378" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1160" height="440" rx="18" fill="#f3f6f0"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#243f32">
    <rect x="36" y="28" width="330" height="365" rx="28" fill="#fff" stroke="#d5ddd2" filter="url(#shadow)"/>
    <path d="m179 63 25-14 25 14v29l-25 14-25-14Z" fill="#dfe7dd" stroke="#8c9e8e" stroke-width="2"/>
    <path d="m226 77 20 34h-40Z" fill="#efc667" stroke="#c29b3f" stroke-width="2"/>
    <path d="M226 88v11m0 5v1" stroke="#75591b" stroke-width="3" stroke-linecap="round"/>
    <text x="65" y="149" font-size="17" font-weight="700">‘aisurada.app’을(를) 열지 않음</text>
    <text x="65" y="181" font-size="14" fill="#57695d"><tspan x="65">Apple은 ‘aisurada.app’에 악성 코드가</tspan><tspan x="65" dy="23">없음을 확인할 수 없습니다.</tspan></text>
    <rect x="62" y="248" width="278" height="38" rx="19" fill="#f0f1ee"/>
    <text x="201" y="273" font-size="14" fill="#859086" text-anchor="middle">휴지통으로 이동</text>
    <rect x="62" y="299" width="278" height="38" rx="19" fill="#eaf3e7" stroke="#3e7951" stroke-width="2.5"/>
    <text x="201" y="324" font-size="15" font-weight="700" text-anchor="middle">완료</text>
    <circle cx="62" cy="318" r="14" fill="#286b50"/><text x="62" y="323" text-anchor="middle" fill="white" font-size="13" font-weight="700">1</text>
    <text x="201" y="368" text-anchor="middle" font-size="12" fill="#768677">이 창은 닫고, 시스템 설정으로</text>
    <path d="M391 213h65" fill="none" stroke="#6d9378" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="484" y="38" width="640" height="355" rx="17" fill="#fff" stroke="#d5ddd2" filter="url(#shadow)"/>
    <path d="M501 38h606a17 17 0 0 1 17 17v37H484V55a17 17 0 0 1 17-17Z" fill="#e9eee6"/>
    <circle cx="507" cy="65" r="4" fill="#b4c3b1"/><circle cx="521" cy="65" r="4" fill="#b4c3b1"/><circle cx="535" cy="65" r="4" fill="#b4c3b1"/>
    <text x="566" y="71" font-size="15" font-weight="600">시스템 설정  ›  개인정보 보호 및 보안</text>
    <text x="516" y="134" font-size="22" font-weight="700">보안</text>
    <rect x="510" y="156" width="588" height="129" rx="11" fill="#f6f8f3" stroke="#e0e7dc"/>
    <text x="531" y="186" font-size="14"><tspan font-weight="700">aisurada.app</tspan><tspan x="531" dy="24" fill="#768677">개발자를 확인할 수 없어 실행이 차단되었습니다.</tspan></text>
    <rect x="921" y="228" width="155" height="37" rx="8" fill="#1479f4"/>
    <rect x="915" y="222" width="167" height="49" rx="12" fill="none" stroke="#4e835c" stroke-width="2.5"/>
    <text x="998" y="252" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">그래도 열기</text>
    <circle cx="915" cy="224" r="14" fill="#286b50"/><text x="915" y="229" text-anchor="middle" fill="white" font-size="13" font-weight="700">2</text>
    <path d="M553 316v-7a8 8 0 0 1 16 0v7m-19 0h22v21h-22Z" fill="none" stroke="#6d8a70" stroke-width="2.5"/>
    <text x="588" y="322" font-size="15" font-weight="600">암호 또는 Touch ID로 승인</text>
    <text x="588" y="345" font-size="12" fill="#768677">이 앱에 대한 실행 예외로 저장됩니다.</text>
    <circle cx="1090" cy="322" r="14" fill="#286b50"/><text x="1090" y="327" text-anchor="middle" fill="white" font-size="13" font-weight="700">3</text>
    <text x="580" y="423" text-anchor="middle" font-size="12" fill="#839080">화면 구성 설명용 · 실제 macOS 스크린샷이 아니며, 버전에 따라 문구와 위치가 다를 수 있습니다.</text>
  </g>
</svg>
