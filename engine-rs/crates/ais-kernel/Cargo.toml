[package]
name = "ais-kernel"
description = "aisurada 엔진의 바닥 크레이트: 글·JSON·오류·노트 머리 YAML·공용 커널(다른 영역을 모르는 순수 코드)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libyaml-safer = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
# 깊이 시험 사례(중첩 50층 안팎)를 읽으려면 JSON 재귀 한도를 풀어야 한다
serde_json = { version = "1", features = ["unbounded_depth"] }
