[package]
name = "ais-cli"
description = "aisurada 명령줄 클라이언트. Java ais-cli와 같은 명령줄·종료 코드·출력으로 Rust 엔진을 부른다"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ais_cli"
path = "src/lib.rs"

[[bin]]
name = "ais-cli"
path = "src/main.rs"

[dependencies]
ais-core = { path = "../ais-core" }
libc = "0.2"
serde_json = "1"

[dev-dependencies]
# 맞대기 예제와 시험이 엔진 안쪽을 만진다
ais-core = { path = "../ais-core", features = ["test-support"] }
# 맞대기 예제의 테이프(폴더 해시)가 쓴다. ais-core와 같은 버전이라 새로 받는 것은 없다.
sha2 = "0.10"
