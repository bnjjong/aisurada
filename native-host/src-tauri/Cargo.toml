[package]
name = "aisurada-host"
version = "0.0.6"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.2", features = ["protocol-asset"] }
tauri-plugin-fs = { version = "=2.5.1", features = ["watch"] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-deep-link = "=2.4.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
portable-pty = "=0.9.0"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
ring = "0.17"
# Java 엔진을 Rust로 옮기는 중이다. 옮긴 읽기 명령은 이 라이브러리를 앱 안에서 직접 부른다(engine.rs).
ais-core = { path = "../../engine-rs/crates/ais-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
security-framework = "3"

[features]
default = ["claude"]
claude = []
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "=2.11.2", features = ["test"] }
tempfile = "3"
