[package]
name = "aisurada-host"
version = "0.2.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = "3"
tauri = { version = "=2.11.2", features = ["protocol-asset"] }
tauri-plugin-fs = { version = "=2.5.1", features = ["watch"] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-deep-link = "=2.4.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
portable-pty = "=0.9.0"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
ring = "0.17"
# Java 엔진을 Rust로 옮겼다. 앱은 이 라이브러리를 앱 안에서 직접 부른다(engine.rs).
ais-core = { path = "../../engine-rs/crates/ais-core" }
# 앱이 엔진의 명령줄(`ais-cli`)을 같은 프로세스 안에서 부른다(sidecar.rs). 사이드카도 프로세스 띄우기도 없다.
ais-cli = { path = "../../engine-rs/crates/ais-cli" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
security-framework = "3"

[features]
default = ["claude"]
claude = []
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "=2.11.2", features = ["test"] }
